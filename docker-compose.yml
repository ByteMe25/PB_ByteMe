services:
  backend:
    image: poc-backend
    pull_policy: never
    # evita di pullare imamagini da internet omonime per sbaglio
    container_name: poc-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - ./backend/src:/app/src
      # cambiamenti visibili senza ricostruzione del docker 
    #command: uvicorn db:app --host 0.0.0.0 --port 8000
    ports:
      - 8000:8000
    environment:  # aggiunte key Zucchetti e secre key sessioni
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - PYTHONPATH=/app
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}


  frontend:  
    image: poc-frontend
    pull_policy: never
    # evita di pullare immagini da internet omonime per sbaglio

    container_name: poc-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # volumes:
      # - ./frontend:/usr/share/nginx/html
      # cambiamenti visibili senza ricostruzione del docker
    ports:
      - 8080:80
    depends_on:
      - backend